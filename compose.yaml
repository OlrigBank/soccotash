name: olrigbank

x-app-image: &app-image
  build:
    context: ./site
    dockerfile: Dockerfile
  image: olrigbank-web:local

services:
  site:
    <<: *app-image
    restart: unless-stopped
    networks:
      - soccotash-shared
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://${POSTGRES_USER:-soccotash}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-soccotash}
      AIRBNB_MAIN_HOUSE_ICAL_URLS: ${AIRBNB_MAIN_HOUSE_ICAL_URLS:-}
      AIRBNB_COTTAGE_ICAL_URLS: ${AIRBNB_COTTAGE_ICAL_URLS:-}
      CALENDAR_SYNC_TOKEN: ${CALENDAR_SYNC_TOKEN:?Set CALENDAR_SYNC_TOKEN in .env}
      BOOKING_SERVICE_URL: http://site:8080
      DATABASE_SSL: "false"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      BOOKING_EMAIL_FROM: ${BOOKING_EMAIL_FROM:-}
      BOOKING_EMAIL_REPLY_TO: ${BOOKING_EMAIL_REPLY_TO:-}
      BOOKING_EMAIL_BCC: ${BOOKING_EMAIL_BCC:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      BOOKING_PUBLIC_URL: ${BOOKING_PUBLIC_URL:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-meta}
      WHATSAPP_DELIVERY_ENABLED: ${WHATSAPP_DELIVERY_ENABLED:-false}
      WHATSAPP_INBOUND_AUTO_REPLY_ENABLED: ${WHATSAPP_INBOUND_AUTO_REPLY_ENABLED:-false}
      WHATSAPP_RECIPIENT_ALLOWLIST_REQUIRED: ${WHATSAPP_RECIPIENT_ALLOWLIST_REQUIRED:-true}
      WHATSAPP_RECIPIENT_ALLOWLIST: ${WHATSAPP_RECIPIENT_ALLOWLIST:-}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_TEMPLATE_BOOKING_UPDATE: ${WHATSAPP_TEMPLATE_BOOKING_UPDATE:-olrig_booking_update_v1}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-en_GB}
    ports:
      - "${OLRIGBANK_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "./scripts/healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  https:
    image: caddy:2-alpine
    restart: unless-stopped
    networks:
      - soccotash-shared
    depends_on:
      site:
        condition: service_healthy
    environment:
      OLRIGBANK_HTTPS_HOST: ${OLRIGBANK_HTTPS_HOST:-192.168.68.56}
    ports:
      - "${OLRIGBANK_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - olrigbank-caddy-data:/data
      - olrigbank-caddy-config:/config

  calendar-sync:
    <<: *app-image
    profiles: ["tools"]
    networks:
      - soccotash-shared
    depends_on:
      site:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-soccotash}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-soccotash}
      AIRBNB_MAIN_HOUSE_ICAL_URLS: ${AIRBNB_MAIN_HOUSE_ICAL_URLS:-}
      AIRBNB_COTTAGE_ICAL_URLS: ${AIRBNB_COTTAGE_ICAL_URLS:-}
      CALENDAR_SYNC_TOKEN: ${CALENDAR_SYNC_TOKEN:?Set CALENDAR_SYNC_TOKEN in .env}
      BOOKING_SERVICE_URL: http://site:8080
      DATABASE_SSL: "false"
    command: ["npm", "run", "sync:calendars"]

  booking-report:
    <<: *app-image
    profiles: ["tools"]
    networks:
      - soccotash-shared
    depends_on:
      site:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-soccotash}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-soccotash}
      CALENDAR_SYNC_TOKEN: ${CALENDAR_SYNC_TOKEN:?Set CALENDAR_SYNC_TOKEN in .env}
      BOOKING_SERVICE_URL: http://site:8080
      DATABASE_SSL: "false"
    command: ["npm", "run", "booking:report"]

networks:
  soccotash-shared:
    external: true
    name: ${SOCCOTASH_DOCKER_NETWORK:-soccotash_default}

volumes:
  olrigbank-caddy-data:
  olrigbank-caddy-config:
