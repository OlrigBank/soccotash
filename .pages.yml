media:
- name: images
  label: Images
  input: site/public/media/images
  output: /media/images
  extensions:
  - png
  - jpg
  - jpeg
  - webp
  - svg
  rename: safe
content:
- name: welcome
  label: Welcome page and poster
  type: file
  path: site/src/data/welcome.yml
  format: yaml
  fields:
  - name: title
    label: Welcome title
    type: string
    required: true
  - name: description
    label: Meta description
    type: text
    required: true
  - name: introduction
    label: Opening copy
    type: text
    required: true
  - name: supportingText
    label: Supporting copy
    type: text
    required: true
  - name: logo
    label: Welcome logo
    type: image
    required: true
  - name: logoAlt
    label: Logo alternative text
    type: string
    required: true
  - name: closingMessage
    label: Closing message
    type: text
    required: true
  - name: printFooter
    label: Print footer
    type: text
    required: true
  - name: emergencyMessage
    label: Emergency message
    type: text
    required: true
  - name: topics
    label: Welcome topics
    type: object
    description: Reorder topics using the list controls. To remove a printed topic, set its status to Retired rather than deleting it. Never reuse an ID for a different topic. Preview the rebuilt page and poster before publication.
    list:
      collapsible:
        collapsed: true
        summary: '{fields.title} ({fields.status})'
    fields:
    - name: id
      label: Permanent QR topic ID
      type: string
      required: true
      description: Set a unique ID when adding a topic. Once saved, leave it unchanged. Build checks preserve historical IDs. The editor cannot lock only existing IDs while allowing new ones.
      pattern:
        regex: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        message: Use lowercase letters, numbers and single hyphens.
    - name: title
      label: Heading
      type: string
      required: true
    - name: summary
      label: Short page and poster summary
      type: text
      required: true
      description: Keep private Wi-Fi passwords, door codes and booking-specific instructions out of this public content.
    - name: detailsUrl
      label: Further-information URL
      type: string
      required: true
      pattern:
        regex: '^(?:/(?!/)[^\s\\]*|https://[^\s\\]+)$'
        message: Use a same-site /path/ or safe https:// URL. Full validation runs during the build.
    - name: detailsLabel
      label: Link label
      type: string
      required: true
    - name: status
      label: Status
      type: select
      required: true
      options:
        values:
        - name: active
          label: Active
        - name: retired
          label: Retired (preserve old printed QR code)
    - name: aliases
      label: Previous topic IDs
      type: string
      list: true
      description: Only for an exceptional ID correction. Keep every previous ID here so printed codes remain useful. Never reuse retired IDs.
      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    - name: includeContactDetails
      label: Include current public contact details
      type: boolean
      description: Adds the phone and email from Contact details to this summary on both the page and poster. Do not copy those details into the summary.
- name: local-guide
  label: Local guide
  type: collection
  path: site/src/content/local-guide
  format: yaml-frontmatter
  filename: '{slug}.md'
  view:
    fields:
    - title
    - category
    - recommended
    primary: title
    sort:
    - title
    - category
    search:
    - title
    - summary
    - body
    default:
      sort: title
      order: asc
  fields:
  - name: title
    label: Title
    type: string
    required: true
  - name: slug
    label: URL slug
    type: string
    required: true
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  - name: legacyId
    label: Legacy ID
    type: string
    readonly: true
  - name: category
    label: Category
    type: select
    required: true
    options:
      values:
      - name: home
        label: Home
      - name: whats-on
        label: What’s on
      - name: outdoor-pursuits
        label: Outdoor pursuits
      - name: close-to-home
        label: Close to home
      - name: further-afield
        label: Further afield
      - name: cycling
        label: Cycling
      - name: local
        label: In Kendal
      - name: eating-out
        label: Eating out
      - name: bars
        label: Bars
      - name: activities
        label: Activities
      - name: exhibitions
        label: Arts and exhibitions
      - name: shopping
        label: Shopping
      - name: music
        label: Music
      - name: pre-owned
        label: Antiques and pre-owned
      - name: antiques
        label: Antiques
      - name: collectables
        label: Collectables
      - name: festivals
        label: Festivals
  - name: categoryLabel
    label: Legacy category label
    type: string
    hidden: true
  - name: image
    label: Image
    type: image
  - name: externalLink
    label: External website
    type: string
  - name: recommended
    label: Recommended / featured
    type: boolean
  - name: summary
    label: Card summary
    type: text
  - name: legacyText
    label: Legacy text
    type: text
    hidden: true
  - name: body
    label: Page body
    type: rich-text
- name: pages
  label: General pages
  type: collection
  path: site/src/content/pages
  format: yaml-frontmatter
  filename: '{slug}.md'
  view:
    fields:
    - title
    - slug
    primary: title
    sort:
    - title
    search:
    - title
    - description
    - body
  fields:
  - name: slug
    label: Internal slug
    type: string
    required: true
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  - name: title
    label: Title
    type: string
    required: true
  - name: description
    label: Meta description
    type: text
  - name: heroTitle
    label: Hero title
    type: string
  - name: heroText
    label: Hero text
    type: text
  - name: body
    label: Page body
    type: rich-text
- name: listings
  label: Listings
  type: collection
  path: site/src/content/listings
  format: yaml-frontmatter
  filename: '{slug}.md'
  view:
    fields:
    - title
    - sleeps
    - featured
    primary: title
    sort:
    - title
    search:
    - title
    - summary
    - body
  fields:
  - name: title
    label: Title
    type: string
    required: true
  - name: slug
    label: URL slug
    type: string
    required: true
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  - name: summary
    label: Summary
    type: text
  - name: seoTitle
    label: SEO title
    type: string
  - name: description
    label: Meta description
    type: text
  - name: heroEyebrow
    label: Hero eyebrow
    type: string
  - name: heroTitle
    label: Hero title
    type: string
  - name: image
    label: Image
    type: image
  - name: imageAlt
    label: Image alternative text
    type: string
  - name: gallery
    label: Gallery
    type: image
    list: true
  - name: sleeps
    label: Sleeps
    type: string
  - name: bedrooms
    label: Bedrooms
    type: string
  - name: bathrooms
    label: Bathrooms
    type: string
  - name: spaces
    label: Spaces used by this listing
    type: reference
    options:
      collection: spaces
      multiple: true
      search: title,summary,spaceType,spaceGroup
      value: '{fields.slug}'
      label: '{primary}'
  - name: featured
    label: Featured
    type: boolean
  - name: body
    label: Listing body
    type: rich-text
- name: spaces
  label: Spaces
  type: collection
  path: site/src/content/spaces
  subfolders: true
  format: yaml-frontmatter
  filename: '{spaceGroup}/{slug}/{slug}.md'
  view:
    fields:
    - title
    - spaceGroup
    - spaceType
    - sortOrder
    - featured
    primary: title
    sort:
    - spaceGroup
    - sortOrder
    - title
    search:
    - title
    - summary
    - spaceType
    - body
  fields:
  - name: title
    label: Title
    type: string
    required: true
  - name: slug
    label: Slug
    type: string
    required: true
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  - name: spaceGroup
    label: Folder group
    type: select
    required: true
    options:
      values:
      - name: house
        label: House
      - name: cottage
        label: Cottage
      - name: garden
        label: Garden
  - name: spaceType
    label: Space type
    type: select
    options:
      values:
      - name: bedroom
        label: Bedroom
      - name: bathroom
        label: Bathroom / WC
      - name: kitchen
        label: Kitchen
      - name: lounge
        label: Lounge
      - name: dining
        label: Dining
      - name: entrance
        label: Entrance / hall
      - name: landing
        label: Landing
      - name: mezzanine
        label: Mezzanine
      - name: garden
        label: Garden
      - name: other
        label: Other
  - name: summary
    label: Summary
    type: text
  - name: image
    label: Main image
    type: image
  - name: gallery
    label: Gallery
    type: image
    list: true
  - name: sleeps
    label: Sleeps
    type: string
  - name: beds
    label: Beds
    type: string
  - name: bathrooms
    label: Bathrooms
    type: string
  - name: ensuite
    label: Ensuite
    type: boolean
  - name: features
    label: Features
    type: string
    list: true
  - name: sortOrder
    label: Sort order
    type: number
  - name: featured
    label: Featured
    type: boolean
  - name: body
    label: Space body
    type: rich-text
- name: settings
  label: Settings
  type: group
  items:
  - name: site-settings
    label: Site settings
    type: file
    path: site/src/data/settings/site.yml
    format: yaml
    fields:
    - name: title
      label: Site title
      type: string
      required: true
    - name: description
      label: Site description
      type: text
    - name: url
      label: Public URL
      type: string
    - name: logo
      label: Logo / default image
      type: image
  - name: contact-settings
    label: Contact details
    type: file
    path: site/src/data/settings/contact.yml
    format: yaml
    fields:
    - name: name
      label: Contact name
      type: string
      required: true
    - name: email
      label: Email
      type: string
      required: true
    - name: phone
      label: Phone
      type: string
      required: true
    - name: whatsapp
      label: WhatsApp
      type: string
    - name: address
      label: Address
      type: text
  - name: navigation
    label: Navigation structure
    type: file
    path: site/src/data/navigation/main.yml
    format: code
    fields: []
