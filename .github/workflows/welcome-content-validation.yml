name: Welcome content validation
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm --prefix site ci
      - run: npm --prefix site run check:welcome-history
      - run: node --experimental-strip-types --test site/tests/booking-lifecycle/welcome-page.test.ts
