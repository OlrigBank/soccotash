name: Holiday-planner browser regression

on:
  workflow_dispatch:
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

jobs:
  planner-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: soccotash
          POSTGRES_PASSWORD: playwright-planner-regression
          POSTGRES_DB: soccotash_planner_regression
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soccotash -d soccotash_planner_regression"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://soccotash:playwright-planner-regression@127.0.0.1:5432/soccotash_planner_regression
      DATABASE_SSL: "false"
      BOOKING_PUBLIC_URL: http://127.0.0.1:8080
      PLANNER_REGRESSION_BASE_URL: http://127.0.0.1:8080
      PLANNER_REGRESSION_ALLOW_MUTATION: "yes"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Install site dependencies
        run: npm --prefix site ci

      - name: Migrate disposable database
        run: npm --prefix site run db:migrate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run planner regression
        run: npm run test:planner-regression

      - name: Upload report and private failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: planner-regression-${{ github.run_number }}
          path: |
            playwright-report/planner-regression/
            test-results/planner-regression/
          if-no-files-found: error
          retention-days: 7
