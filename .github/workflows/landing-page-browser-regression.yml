name: Public-experience browser regression

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-public-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: soccotash
          POSTGRES_PASSWORD: playwright-public-regression
          POSTGRES_DB: soccotash_public_regression
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soccotash -d soccotash_public_regression"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://soccotash:playwright-public-regression@127.0.0.1:5432/soccotash_public_regression
      DATABASE_SSL: "false"
      BOOKING_PUBLIC_URL: http://127.0.0.1:8080

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Install site dependencies
        run: npm --prefix site ci

      - name: Migrate disposable database
        run: npm --prefix site run db:migrate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public-experience regression
        run: npm run test:public-experience-regression

      - name: Upload report and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: public-experience-regression-${{ github.run_number }}
          path: |
            playwright-report/landing-page-regression/
            test-results/landing-page-regression/
          if-no-files-found: error
          retention-days: 14
