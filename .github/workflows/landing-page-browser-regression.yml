name: Public-experience browser regression

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-public-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Install site dependencies
        run: npm --prefix site ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public-experience regression
        run: npm run test:public-experience-regression

      - name: Upload report and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: public-experience-regression-${{ github.run_number }}
          path: |
            playwright-report/landing-page-regression/
            test-results/landing-page-regression/
          if-no-files-found: error
          retention-days: 14
