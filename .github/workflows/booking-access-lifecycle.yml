name: Booking access lifecycle

on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: soccotash_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d soccotash_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: site

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/soccotash_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/soccotash_test
      DATABASE_SSL: "false"
      NODE_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run booking lifecycle unit tests
        run: npm run test:booking-lifecycle

      - name: Run Booker access integration test
        run: npm run test:booking-access-integration

      - name: Type-check Astro
        run: npm run check

      - name: Build production bundle
        run: npm run build
