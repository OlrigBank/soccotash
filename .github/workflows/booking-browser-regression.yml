name: Bespoke booking browser regression

on:
  workflow_dispatch:
  push:
    branches:
      - live-smoke-test

permissions:
  contents: read

jobs:
  bespoke-booking-regression:
    name: Record bespoke booking regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: soccotash
          POSTGRES_PASSWORD: playwright-regression
          POSTGRES_DB: soccotash_regression
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soccotash -d soccotash_regression"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://soccotash:playwright-regression@127.0.0.1:5432/soccotash_regression
      DATABASE_SSL: "false"
      BOOKING_PUBLIC_URL: http://127.0.0.1:8080
      BOOKING_REGRESSION_BASE_URL: http://127.0.0.1:8080
      BOOKING_REGRESSION_ALLOW_MUTATION: "yes"
      BOOKING_REGRESSION_ADMIN_EMAIL: playwright-admin@example.test
      BOOKING_REGRESSION_ADMIN_PASSWORD: playwright-admin-password
      ADMIN_EMAIL: playwright-admin@example.test
      ADMIN_PASSWORD: playwright-admin-password

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install application dependencies
        run: npm ci --prefix site
      - name: Migrate disposable database
        run: npm --prefix site run db:migrate
      - name: Create disposable administrator
        run: npm --prefix site run admin:create -- "$ADMIN_EMAIL" "Playwright Admin"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Record controlled booking regression
        run: npm run test:booking-regression
      - name: Upload regression playback
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: bespoke-booking-regression-${{ github.run_number }}
          path: |
            playwright-report/booking-regression/
            test-results/booking-regression/
          if-no-files-found: error
          retention-days: 7
