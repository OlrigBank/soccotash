properties:
  - id: main-house
    name: Olrig Bank (max 8 guests)
    listingSlug: olrig-bank
    airbnbCalendarEnv: AIRBNB_MAIN_HOUSE_ICAL_URLS
    minimumNights: 2
    maximumGuests: 10
    enabled: true
  - id: cottage
    name: Cottage at Olrig Bank (max 4 guests)
    listingSlug: cottage
    airbnbCalendarEnv: AIRBNB_COTTAGE_ICAL_URLS
    minimumNights: 2
    maximumGuests: 4
    enabled: true
  - id: whole-property
    name: Olrig Bank++ (max 12 guests)
    listingSlug: event
    availabilityPropertyId: main-house
    availabilityNote: Availability is based on the Olrig Bank calendar. Jenna will confirm that the additional two-bedroom accommodation is also available.
    minimumNights: 2
    maximumGuests: 12
    enabled: true
  - id: bespoke-arrangement
    name: Request a bespoke stay
    listingSlug: bespoke
    administratorPriced: true
    availabilityPropertyIds:
      - main-house
      - cottage
    availabilityNote: The dates must be available across Olrig Bank. Your request does not reserve them; Jenna will agree the accommodation and price with you.
    minimumNights: 1
    maximumGuests: 12
    enabled: true
