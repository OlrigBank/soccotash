title: Welcome to Olrig Bank
description: Useful information for guests staying at Olrig Bank in Kendal,
  including arrival, house essentials, the garden and departure.
introduction: Your Kendal stay starts here.
supportingText: A few useful pointers for a comfortable stay.
logo: /media/images/olrig-bank-welcome-logo.jpg
logoAlt: Olrig Bank, Kendal — circular gold lettering on green
closingMessage: We hope you have a wonderful stay.
printFooter: olrig-bank.com | Point your phone camera at a QR code, then tap the link.
emergencyMessage: For an emergency involving immediate danger, contact the
  emergency services first.
topics:
  - id: parking-access
    title: Parking & access
    summary: Please park considerately and keep access clear. Follow the key and
      access instructions supplied for your booking.
    detailsUrl: /guest-information/#parking-and-arrival
    detailsLabel: Arrival guidance
    status: active
    includeContactDetails: false
  - id: wifi-heating-appliances
    title: Wi-Fi, heating & general appliances
    summary: Your booking information contains the current Wi-Fi details. This
      section contains information about the use of heating and the general
      appliances in the house. Contact Jenna if something is not working.
    detailsUrl: /house-essentials
    detailsLabel: House essentials
    status: active
    includeContactDetails: false
  - id: garden
    title: Enjoy the garden
    summary: The garden is available for your use, but please read and observe the
      rules given in the Use of the Garden page
    detailsUrl: /enjoy-the-garden
    detailsLabel: Enjoy the Garden
    status: active
    includeContactDetails: false
  - id: local-guide
    title: Explore Kendal & beyond
    summary: Discover walks, places to eat, activities and days out in our local
      guide. There is plenty to enjoy close to home and across the Lakes.
    detailsUrl: /local-guide/
    detailsLabel: Explore the local guide
    status: active
    includeContactDetails: false
  - id: help
    title: Need a hand?
    summary: Contact Jenna with questions or maintenance issues.
    detailsUrl: /contact/#contact-jenna
    detailsLabel: Contact Jenna
    status: active
    includeContactDetails: true
  - id: departure
    title: Before you leave
    summary: Follow your booking-specific departure time and instructions. Secure
      the property, return keys as directed and report any damage or issues.
    detailsUrl: /guest-information/#departure
    detailsLabel: Departure guidance
    status: active
    includeContactDetails: false
  - id: direct-booking
    title: Direct Booking
    summary: "The best way way to stay at Olrig Bank is by making a direct booking.
      It will always be the cheapest way to get a reservation and we can provide
      a more flexible and personal service that we can ever offer through
      intermediaries "
    detailsUrl: /book/
    detailsLabel: Direct Booking
    status: active
    includeContactDetails: false
